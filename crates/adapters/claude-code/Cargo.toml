[package]
name = "adapter-claude-code"
description = "AI provider that runs `claude -p` (Claude Code, non-interactive) with the user's session."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
application.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time"] }

[dev-dependencies]
application = { workspace = true, features = ["test-support"] }
chrono.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "fs"] }

[lints]
workspace = true
