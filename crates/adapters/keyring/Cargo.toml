[package]
name = "adapter-keyring"
description = "Secret stores: environment variables, the OS keychain, and a layered combination."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
application.workspace = true

# `keyring` necesita un backend distinto en cada sistema operativo. Las features se eligen
# por plataforma con `[target.'cfg(...)'.dependencies]`; Cargo une estas secciones.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native"] }

[dev-dependencies]
application = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
