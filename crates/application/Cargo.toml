[package]
name = "application"
description = "Taskflow application layer: ports (traits), use cases and serializable DTOs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
domain.workspace = true
async-trait.workspace = true
chrono = { workspace = true, features = ["clock", "serde"] }
enumset.workspace = true
futures.workspace = true
secrecy.workspace = true
serde.workspace = true
thiserror.workspace = true
# Solo para los fakes de `testing` (ids de conversación).
uuid = { workspace = true, optional = true }

[dev-dependencies]
uuid.workspace = true
domain = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
# Expone `application::testing` (fakes de los puertos) para los tests de otros crates.
test-support = ["domain/test-support", "dep:uuid"]

[lints]
workspace = true
