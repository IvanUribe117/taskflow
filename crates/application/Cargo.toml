[package]
name = "application"
description = "Taskflow application layer: ports (traits), use cases and serializable DTOs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
domain.workspace = true
async-trait.workspace = true
chrono = { workspace = true, features = ["clock", "serde"] }
futures.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
domain = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
# Expone `application::testing` (fakes de los puertos) para los tests de otros crates.
test-support = ["domain/test-support"]

[lints]
workspace = true
